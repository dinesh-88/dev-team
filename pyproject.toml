[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-devteam"
version = "0.1.0"
description = "An A2A team of AI agents (planner, coders, QA) that changes several repos at once."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.2,<2",
    "anthropic>=0.40",
    "claude-agent-sdk>=0.2",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pytest>=8",  # runs the demo repos' tests
]

[project.scripts]
devteam = "devteam.cli:main"

[tool.setuptools.packages.find]
include = ["devteam*"]
